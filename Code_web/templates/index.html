<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Check-in System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- LEFT: Camera panel -->
    <div id="left">

        <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name">EmotionScan</span>
            <span class="brand-version">v2.0</span>
        </div>

        <div class="cam-wrapper">
            <div class="cam-container" id="camContainer">
                <!--
                    MJPEG stream từ server-side camera.
                    Canvas overlay vẽ bounding boxes lên trên.
                -->
                <img id="mjpeg" src="{{ url_for('video_feed') }}" alt="camera stream"
                     crossorigin="anonymous">
                <canvas id="overlay"></canvas>

                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>

                <div class="cam-status-bar">
                    <span class="live-dot"></span>
                    <span id="faceCount">0 khuôn mặt</span>
                    <span class="cam-fps" id="fpsDisplay">-- fps</span>
                </div>
            </div>
        </div>

        <!-- Emotion pill display -->
        <div class="emotion-row">
            <div class="emotion-pill" id="emotionPill">
                <span class="emotion-icon" id="emotionIcon">😐</span>
                <span class="emotion-label" id="emotionLabel">Chờ nhận diện...</span>
                <span class="emotion-conf" id="emotionConf"></span>
            </div>
        </div>

        <!-- Confidence bars -->
        <div class="emo-bars" id="emoBars">
            <div class="emo-bar-row" data-emo="Angry">
                <span class="emo-bar-name">Angry</span>
                <div class="emo-bar-track"><div class="emo-bar-fill angry" style="width:0%"></div></div>
                <span class="emo-bar-val">0%</span>
            </div>
            <div class="emo-bar-row" data-emo="Disgust">
                <span class="emo-bar-name">Disgust</span>
                <div class="emo-bar-track"><div class="emo-bar-fill disgust" style="width:0%"></div></div>
                <span class="emo-bar-val">0%</span>
            </div>
            <div class="emo-bar-row" data-emo="Fear">
                <span class="emo-bar-name">Fear</span>
                <div class="emo-bar-track"><div class="emo-bar-fill fear" style="width:0%"></div></div>
                <span class="emo-bar-val">0%</span>
            </div>
            <div class="emo-bar-row" data-emo="Happy">
                <span class="emo-bar-name">Happy</span>
                <div class="emo-bar-track"><div class="emo-bar-fill happy" style="width:0%"></div></div>
                <span class="emo-bar-val">0%</span>
            </div>
            <div class="emo-bar-row" data-emo="Neutral">
                <span class="emo-bar-name">Neutral</span>
                <div class="emo-bar-track"><div class="emo-bar-fill neutral" style="width:0%"></div></div>
                <span class="emo-bar-val">0%</span>
            </div>
            <div class="emo-bar-row" data-emo="Sad">
                <span class="emo-bar-name">Sad</span>
                <div class="emo-bar-track"><div class="emo-bar-fill sad" style="width:0%"></div></div>
                <span class="emo-bar-val">0%</span>
            </div>
            <div class="emo-bar-row" data-emo="Surprise">
                <span class="emo-bar-name">Surprise</span>
                <div class="emo-bar-track"><div class="emo-bar-fill surprise" style="width:0%"></div></div>
                <span class="emo-bar-val">0%</span>
            </div>
        </div>

        <!-- Action buttons -->
        <div class="btn-group">
            <button id="btnScan" class="btn btn-scan">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Scan cảm xúc (5s)
            </button>
        </div>

    </div>

    <!-- RIGHT: Log panel -->
    <div id="right">

        <div class="right-header">
            <div class="right-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/></svg>
                Nhật Ký Hệ Thống
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
                <div class="log-count" id="logCount">0 sự kiện</div>
                <div class="employee-info">Nhân viên: <strong>{{ user }}</strong></div>
                <a class="btn btn-logout" href="{{ url_for('logout') }}">Đăng xuất</a>
            </div>
        </div>

        <!-- Stats row -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-val" id="statOut">0</div>
                <div class="stat-lbl">Ra</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="statHappy">0</div>
                <div class="stat-lbl">Happy 😊</div>
            </div>
        </div>

        <div class="mood-chart">
            <div class="chart-header">Tâm trạng khách</div>
            <div class="chart-body">
                <div class="chart-panel">
                    <div class="chart-title">Ra</div>
                    <div class="chart-donut" id="moodChartOut"></div>
                    <div class="chart-legend" id="moodLegendOut"></div>
                </div>
            </div>
        </div>

        <div class="scroll-box">
            <table id="logTable">
                <thead>
                    <tr>
                        <th>Giờ</th>
                        <th>Hành Động</th>
                        <th>Cảm Xúc</th>
                        <th>Sao</th>
                        <th>Tin cậy</th>
                    </tr>
                </thead>
                <tbody id="logBody"></tbody>
            </table>
            <div class="empty-state" id="emptyState">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
                <p>Chưa có dữ liệu</p>
            </div>
        </div>

        <button id="btnExport" class="btn btn-export">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Xuất CSV & Reset
        </button>

    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script>
        const LOGGED_IN_USER = "{{ user }}";
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
